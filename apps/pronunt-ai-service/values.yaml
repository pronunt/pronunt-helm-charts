fullnameOverride: pronunt-ai-service

replicaCount: 1

namespace:
  create: false
  name: pronunt-app-ns

image:
  repository: ghcr.io/pronunt/pronunt-ai-service
  tag: latest
  pullPolicy: IfNotPresent

containerPort: 8000

serviceAccount:
  create: true
  name: ""
  automountServiceAccountToken: false

secretTemplate:
  enabled: false

service:
  enabled: true
  type: ClusterIP
  port: 8000
  targetPort: 8000

resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

podAnnotations: {}
podLabels: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false
nodeSelector: {}
tolerations: []
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          topologyKey: kubernetes.io/hostname
          labelSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - pronunt-ai-service

startupProbe:
  httpGet:
    path: /api/v1/health/live
    port: 8000
  failureThreshold: 30
  periodSeconds: 10
readinessProbe:
  httpGet:
    path: /api/v1/health/ready
    port: 8000
  initialDelaySeconds: 5
  periodSeconds: 10
livenessProbe:
  httpGet:
    path: /api/v1/health/live
    port: 8000
  initialDelaySeconds: 15
  periodSeconds: 20

env:
  config:
    APP_NAME: pronunt-ai-service
    APP_ENV: production
    APP_HOST: 0.0.0.0
    APP_PORT: "8000"
    LOG_LEVEL: INFO
    LOG_USE_COLORS: "false"
    REQUEST_ID_HEADER: X-Request-ID
    HTTP_TIMEOUT_SECONDS: "10"
    AI_DEFAULT_PROVIDER: inhouse
    INHOUSE_BASE_URL: http://pronunt-ollama:11434
    INHOUSE_MODEL: llama3.1:8b
    OPENAI_MODEL: gpt-5-mini
    AUTH_ENABLED: "false"
    ALLOW_UNSAFE_DEV_AUTH: "false"
  secret:
    OPENAI_API_KEY: change-me

httpRoute:
  enabled: true
  hostnames:
    - pronunt.com
  parentRefs:
    - name: pronunt-gateway
      namespace: pronunt-gateway-ns
  pathPrefix: /api/v1/ai
