fullnameOverride: pronunt-worker-service

replicaCount: 1

namespace:
  create: false
  name: pronunt-app-ns

image:
  repository: ghcr.io/pronunt/pronunt-worker-service
  tag: latest
  pullPolicy: IfNotPresent

containerPort: 8000

serviceAccount:
  create: true
  name: ""
  automountServiceAccountToken: false

secretTemplate:
  enabled: false

service:
  enabled: true
  type: ClusterIP
  port: 8000
  targetPort: 8000

resources:
  requests:
    cpu: 150m
    memory: 192Mi
  limits:
    cpu: 400m
    memory: 384Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

podAnnotations: {}
podLabels: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false
nodeSelector: {}
tolerations: []
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          topologyKey: kubernetes.io/hostname
          labelSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - pronunt-worker-service

startupProbe:
  httpGet:
    path: /api/v1/health/live
    port: 8000
  failureThreshold: 30
  periodSeconds: 10
readinessProbe:
  httpGet:
    path: /api/v1/health/ready
    port: 8000
  initialDelaySeconds: 5
  periodSeconds: 10
livenessProbe:
  httpGet:
    path: /api/v1/health/live
    port: 8000
  initialDelaySeconds: 15
  periodSeconds: 20

env:
  config:
    APP_NAME: pronunt-worker-service
    APP_ENV: production
    APP_HOST: 0.0.0.0
    APP_PORT: "8000"
    LOG_LEVEL: INFO
    LOG_USE_COLORS: "false"
    REQUEST_ID_HEADER: X-Request-ID
    HTTP_TIMEOUT_SECONDS: "10"
    RABBITMQ_URL: <set-rabbitmq-uri>
    RABBITMQ_EXCHANGE: pronunt.events
    RABBITMQ_PR_ROUTING_KEY: pull_request.normalized
    RABBITMQ_PR_QUEUE: pronunt.pull_requests.normalized
    AGGREGATOR_SERVICE_URL: http://pronunt-aggregator-service:8000
    WORKER_CONSUMER_ENABLED: "true"
    AUTH_ENABLED: "false"
    ALLOW_UNSAFE_DEV_AUTH: "false"
  secret:
    WORKER_AUTH_TOKEN: change-me

httpRoute:
  enabled: true
  hostnames:
    - pronunt.com
  parentRefs:
    - name: pronunt-gateway
      namespace: pronunt-gateway-ns
  pathPrefix: /api/v1/worker
