image:
  tag: v1.0.0
resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 70
env:
  config:
    APP_ENV: production
    WORKER_CONSUMER_ENABLED: "false"

tolerations:
  - key: gpu
    operator: Equal
    value: "true"
    effect: NoSchedule
namespace:
  name: pronunt-app-ns
httpRoute:
  enabled: true
  hostnames:
    - pronunt.com
  parentRefs:
    - name: pronunt-gateway
      namespace: pronunt-gateway-ns
  pathPrefix: /api/v1/worker
