image:
  tag: prod

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 70

tolerations:
  - key: gpu
    operator: Equal
    value: "true"
    effect: NoSchedule

env:
  config:
    APP_ENV: production


namespace:
  name: pronunt-app-ns

httpRoute:
  enabled: true
  hostnames:
    - pronunt.com
  parentRefs:
    - name: pronunt-gateway
      namespace: pronunt-gateway-ns
  pathPrefix: /api/v1/aggregator

