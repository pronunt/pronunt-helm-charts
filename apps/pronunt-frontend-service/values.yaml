fullnameOverride: pronunt-frontend-service

replicaCount: 2

namespace:
  create: false
  name: pronunt-app-ns

image:
  repository: ghcr.io/pronunt/pronunt-frontend-service
  tag: latest
  pullPolicy: IfNotPresent

containerPort: 3000

serviceAccount:
  create: true
  name: ""
  automountServiceAccountToken: false

secretTemplate:
  enabled: false

service:
  enabled: true
  type: ClusterIP
  port: 3000
  targetPort: 3000

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 75

podAnnotations: {}
podLabels: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false
nodeSelector: {}
tolerations: []
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          topologyKey: kubernetes.io/hostname
          labelSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - pronunt-frontend-service

readinessProbe:
  httpGet:
    path: /
    port: 3000
  initialDelaySeconds: 5
  periodSeconds: 10
livenessProbe:
  httpGet:
    path: /
    port: 3000
  initialDelaySeconds: 15
  periodSeconds: 20

env:
  config:
    NEXT_PUBLIC_AGGREGATOR_API_URL: http://pronunt-aggregator-service:8000
    NEXT_PUBLIC_APP_NAME: Pronunt
    NEXT_TELEMETRY_DISABLED: "1"
  secret:
    FRONTEND_SESSION_SECRET: change-me

httpRoute:
  enabled: true
  hostnames:
    - pronunt.com
  parentRefs:
    - name: pronunt-gateway
      namespace: pronunt-gateway-ns
  pathPrefix: /

