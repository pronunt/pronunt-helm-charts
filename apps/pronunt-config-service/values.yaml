fullnameOverride: pronunt-config-service

replicaCount: 1

namespace:
  create: false
  name: pronunt-app-ns

image:
  repository: ghcr.io/pronunt/pronunt-config-service
  tag: latest
  pullPolicy: IfNotPresent

containerPort: 8000

serviceAccount:
  create: true
  name: ""
  automountServiceAccountToken: false

secretTemplate:
  enabled: false

service:
  enabled: true
  type: ClusterIP
  port: 8000
  targetPort: 8000

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 300m
    memory: 384Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

podAnnotations: {}
podLabels: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false
nodeSelector: {}
tolerations: []
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          topologyKey: kubernetes.io/hostname
          labelSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - pronunt-config-service

startupProbe:
  httpGet:
    path: /api/v1/health/live
    port: 8000
  failureThreshold: 30
  periodSeconds: 10
readinessProbe:
  httpGet:
    path: /api/v1/health/ready
    port: 8000
  initialDelaySeconds: 5
  periodSeconds: 10
livenessProbe:
  httpGet:
    path: /api/v1/health/live
    port: 8000
  initialDelaySeconds: 15
  periodSeconds: 20

env:
  config:
    APP_NAME: pronunt-config-service
    APP_ENV: production
    APP_HOST: 0.0.0.0
    APP_PORT: "8000"
    LOG_LEVEL: INFO
    LOG_USE_COLORS: "true"
    REQUEST_ID_HEADER: X-Request-ID
    HTTP_TIMEOUT_SECONDS: "10"
    MONGODB_DATABASE: pronunt
    MONGODB_SERVICE_COLLECTION: config_services
    MONGODB_DEPENDENCY_COLLECTION: config_dependencies
    AUTH_SERVICE_URL: http://pronunt-auth-service:8000
    AUTH_ENABLED: "false"
    ALLOW_UNSAFE_DEV_AUTH: "false"
  secret:
    MONGODB_URI: <set-mongodb-uri-via-sealed-secret>
    INTERNAL_SERVICE_TOKEN: change-me

httpRoute:
  enabled: true
  hostnames:
    - pronunt.com
  parentRefs:
    - name: pronunt-gateway
      namespace: pronunt-gateway-ns
  pathPrefix: /api/v1/config
