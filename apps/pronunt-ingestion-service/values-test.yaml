image:
  tag: test

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 256Mi

env:
  config:
    APP_ENV: test


namespace:
  name: pronunt-app-test-ns

httpRoute:
  enabled: true
  hostnames:
    - pronunt.com
  parentRefs:
    - name: pronunt-gateway-test
      namespace: pronunt-gateway-test-ns
  pathPrefix: /api/v1/ingestion

