image:
  tag: v1.0.0
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 300m
    memory: 384Mi
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
env:
  config:
    APP_ENV: production
    RABBITMQ_URL: amqp://pronuntuser:pronuntpassword@pronunt-rabbitmq:5672/
namespace:
  name: pronunt-app-ns
httpRoute:
  enabled: true
  hostnames:
    - pronunt.com
  parentRefs:
    - name: pronunt-gateway
      namespace: pronunt-gateway-ns
  pathPrefix: /api/v1/ingestion
