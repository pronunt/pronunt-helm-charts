name: Helm and Kyverno PR Gate

on:
  pull_request:
    branches:
      - prod
    paths:
      - "apps/**"
      - "env/**"
      - "infra/**"
      - "policies/**"
      - ".github/workflows/helm-kyverno-pr-gate.yaml"

concurrency:
  group: helm-kyverno-pr-gate-prod
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect impacted charts
    runs-on: ubuntu-latest
    outputs:
      charts: ${{ steps.detect.outputs.charts }}
      charts_count: ${{ steps.detect.outputs.charts_count }}
      values_suffix: ${{ steps.detect.outputs.values_suffix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed charts
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          base_ref="${{ github.event.pull_request.base.ref }}"
          git fetch origin "${base_ref}" --depth=1

          changed_files="$(git diff --name-only "origin/${base_ref}...HEAD")"
          echo "Changed files:"
          printf '%s\n' "${changed_files}"

          env_changed=false
          policy_or_workflow_changed=false
          declare -A charts=()

          while IFS= read -r file; do
            [[ -z "${file}" ]] && continue

            if [[ "${file}" == env/* ]]; then
              env_changed=true
            fi

            if [[ "${file}" == policies/* || "${file}" == ".github/workflows/helm-kyverno-pr-gate.yaml" ]]; then
              policy_or_workflow_changed=true
            fi

            if [[ "${file}" == apps/*/* || "${file}" == infra/*/* ]]; then
              chart_dir="$(cut -d/ -f1-2 <<< "${file}")"
              if [[ -f "${chart_dir}/Chart.yaml" ]]; then
                charts["${chart_dir}"]=1
              fi
            fi
          done <<< "${changed_files}"

          if [[ "${env_changed}" == true || "${policy_or_workflow_changed}" == true ]]; then
            while IFS= read -r chart_yaml; do
              chart_dir="$(dirname "${chart_yaml}")"
              charts["${chart_dir}"]=1
            done < <(find apps infra -mindepth 2 -maxdepth 2 -name Chart.yaml | sort)
          fi

          if [[ "${#charts[@]}" -eq 0 ]]; then
            charts_json='[]'
            charts_count=0
          else
            mapfile -t sorted_charts < <(printf '%s\n' "${!charts[@]}" | sort)
            charts_json="$(printf '%s\n' "${sorted_charts[@]}" | jq -R . | jq -s -c .)"
            charts_count="${#sorted_charts[@]}"
          fi

          values_suffix="prod"

          echo "charts=${charts_json}" >> "${GITHUB_OUTPUT}"
          echo "charts_count=${charts_count}" >> "${GITHUB_OUTPUT}"
          echo "values_suffix=${values_suffix}" >> "${GITHUB_OUTPUT}"

  validate:
    name: Helm lint and Kyverno
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.charts_count != '0' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chart: ${{ fromJson(needs.detect-changes.outputs.charts) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: Install Kyverno CLI
        shell: bash
        run: |
          set -euo pipefail
          version="v1.13.4"
          tmp_dir="$(mktemp -d)"
          curl -fsSL "https://github.com/kyverno/kyverno/releases/download/${version}/kyverno-cli_${version}_linux_x86_64.tar.gz" -o "${tmp_dir}/kyverno.tar.gz"
          tar -xzf "${tmp_dir}/kyverno.tar.gz" -C "${tmp_dir}"
          sudo install -m 0755 "${tmp_dir}/kyverno" /usr/local/bin/kyverno
          kyverno version

      - name: Build dependencies
        shell: bash
        run: |
          set -euo pipefail
          helm dependency build "${{ matrix.chart }}"

      - name: Helm lint
        shell: bash
        run: |
          set -euo pipefail
          chart="${{ matrix.chart }}"
          suffix="${{ needs.detect-changes.outputs.values_suffix }}"
          values_file="${chart}/values-${suffix}.yaml"
          helm lint "${chart}" -f "${chart}/values.yaml" -f "${values_file}"

      - name: Render chart
        id: chart-meta
        shell: bash
        run: |
          set -euo pipefail
          chart="${{ matrix.chart }}"
          suffix="${{ needs.detect-changes.outputs.values_suffix }}"
          chart_name="$(basename "${chart}")"
          chart_slug="${chart//\//-}"
          echo "chart_name=${chart_name}" >> "${GITHUB_OUTPUT}"
          echo "chart_slug=${chart_slug}" >> "${GITHUB_OUTPUT}"
          values_file="${chart}/values-${suffix}.yaml"
          mkdir -p rendered reports
          helm template "${chart_name}" "${chart}" \
            -f "${chart}/values.yaml" \
            -f "${values_file}" \
            > "rendered/${chart_name}.yaml"

      - name: Kyverno validate base policies
        shell: bash
        run: |
          set -euo pipefail
          chart_name="$(basename "${{ matrix.chart }}")"
          kyverno apply policies/base \
            --resource "rendered/${chart_name}.yaml" \
            --output json \
            > "reports/${chart_name}-base-policy-report.json"

      - name: Kyverno validate environment policies
        shell: bash
        run: |
          set -euo pipefail
          chart_name="$(basename "${{ matrix.chart }}")"
          suffix="${{ needs.detect-changes.outputs.values_suffix }}"

          if [[ -d "policies/${suffix}" ]] && find "policies/${suffix}" -type f -name '*.yaml' | grep -q .; then
            kyverno apply "policies/${suffix}" \
              --resource "rendered/${chart_name}.yaml" \
              --output json \
              > "reports/${chart_name}-${suffix}-policy-report.json"
          else
            printf '{}' > "reports/${chart_name}-${suffix}-policy-report.json"
          fi

      - name: Upload rendered manifests
        uses: actions/upload-artifact@v4
        with:
          name: rendered-${{ steps.chart-meta.outputs.chart_slug }}
          path: rendered/

      - name: Upload Kyverno reports
        uses: actions/upload-artifact@v4
        with:
          name: kyverno-${{ steps.chart-meta.outputs.chart_slug }}
          path: reports/

  no-op:
    name: No impacted charts
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.charts_count == '0' }}
    runs-on: ubuntu-latest
    steps:
      - name: Summary
        shell: bash
        run: |
          echo "No Helm chart changes detected. Skipping lint/template/policy validation." >> "${GITHUB_STEP_SUMMARY}"
