apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pronunt-nfs-csi-storageclass-test
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/pronunt/pronunt-helm-charts.git
    targetRevision: test
    path: infra/nfs-csi-storageclass
    helm:
      valueFiles:
        - values.yaml
        - values-test.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
