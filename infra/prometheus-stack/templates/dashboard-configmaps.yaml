{{- if .Values.dashboards.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: pronunt-grafana-dashboard-service-logs
  namespace: {{ .Release.Namespace }}
  labels:
    grafana_dashboard: "1"
data:
  pronunt-service-logs.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "links": [],
      "panels": [
        {
          "datasource": "$logs",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "continuous-GrYlRd"
              }
            },
            "overrides": []
          },
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "sum(count_over_time({namespace=~\"$namespace\",service=~\"$service\",pod=~\"$pod\",container=~\"$container\"} |~ \"(?i)$level\" [5m]))",
              "queryType": "instant",
              "refId": "A"
            }
          ],
          "title": "Log lines in last 5m",
          "type": "stat"
        },
        {
          "datasource": "$logs",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "continuous-BlPu"
              }
            },
            "overrides": []
          },
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 6,
            "y": 0
          },
          "id": 2,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "count(count_over_time({namespace=~\"$namespace\",service=~\"$service\",pod=~\"$pod\",container=~\"$container\"} |~ \"(?i)$level\" [5m]))",
              "queryType": "instant",
              "refId": "A"
            }
          ],
          "title": "Active streams",
          "type": "stat"
        },
        {
          "datasource": "$logs",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "continuous-RdYlGr"
              }
            },
            "overrides": []
          },
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 12,
            "y": 0
          },
          "id": 3,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "sum(count_over_time({namespace=~\"$namespace\",service=~\"$service\",pod=~\"$pod\",container=~\"$container\"} |~ \"(?i)(error|exception|fatal|panic)\" [15m]))",
              "queryType": "instant",
              "refId": "A"
            }
          ],
          "title": "Error lines in last 15m",
          "type": "stat"
        },
        {
          "datasource": "$logs",
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 18,
            "y": 0
          },
          "id": 4,
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "single"
            }
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "sum by (service) (count_over_time({namespace=~\"$namespace\",service=~\"$service\",pod=~\"$pod\",container=~\"$container\"} |~ \"(?i)$level\" [5m]))",
              "legendFormat": "{{ `{{service}}` }}",
              "queryType": "range",
              "refId": "A"
            }
          ],
          "title": "Log rate by service",
          "type": "timeseries"
        },
        {
          "datasource": "$logs",
          "gridPos": {
            "h": 18,
            "w": 24,
            "x": 0,
            "y": 5
          },
          "id": 5,
          "options": {
            "dedupStrategy": "none",
            "enableLogDetails": true,
            "prettifyLogMessage": false,
            "showCommonLabels": false,
            "showLabels": true,
            "showTime": true,
            "sortOrder": "Descending",
            "wrapLogMessage": true
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "{namespace=~\"$namespace\",service=~\"$service\",pod=~\"$pod\",container=~\"$container\"} |~ \"(?i)$level\"",
              "queryType": "range",
              "refId": "A"
            }
          ],
          "title": "Service logs",
          "type": "logs"
        }
      ],
      "refresh": "10s",
      "schemaVersion": 39,
      "style": "dark",
      "tags": [
        "pronunt",
        "logs"
      ],
      "templating": {
        "list": [
          {
            "current": {
              "text": "Loki",
              "value": "Loki"
            },
            "hide": 2,
            "label": "Logs",
            "name": "logs",
            "options": [],
            "query": "loki",
            "refresh": 1,
            "regex": "",
            "type": "datasource"
          },
          {
            "current": {
              "selected": true,
              "text": "pronunt-app-ns",
              "value": "pronunt-app-ns"
            },
            "definition": "pronunt-app-ns,pronunt-app-test-ns,pronunt-ai-infra-ns,pronunt-ai-infra-test-ns,pronunt-monitoring-ns,pronunt-monitoring-test-ns,kube-system,argocd-ns",
            "hide": 0,
            "includeAll": false,
            "label": "Namespace",
            "multi": false,
            "name": "namespace",
            "options": [
              {
                "selected": true,
                "text": "pronunt-app-ns",
                "value": "pronunt-app-ns"
              },
              {
                "selected": false,
                "text": "pronunt-app-test-ns",
                "value": "pronunt-app-test-ns"
              },
              {
                "selected": false,
                "text": "pronunt-ai-infra-ns",
                "value": "pronunt-ai-infra-ns"
              },
              {
                "selected": false,
                "text": "pronunt-ai-infra-test-ns",
                "value": "pronunt-ai-infra-test-ns"
              },
              {
                "selected": false,
                "text": "pronunt-monitoring-ns",
                "value": "pronunt-monitoring-ns"
              },
              {
                "selected": false,
                "text": "pronunt-monitoring-test-ns",
                "value": "pronunt-monitoring-test-ns"
              },
              {
                "selected": false,
                "text": "kube-system",
                "value": "kube-system"
              },
              {
                "selected": false,
                "text": "argocd-ns",
                "value": "argocd-ns"
              }
            ],
            "query": "pronunt-app-ns,pronunt-app-test-ns,pronunt-ai-infra-ns,pronunt-ai-infra-test-ns,pronunt-monitoring-ns,pronunt-monitoring-test-ns,kube-system,argocd-ns",
            "type": "custom"
          },
          {
            "allValue": ".*",
            "current": {
              "selected": true,
              "text": "All",
              "value": ".*"
            },
            "hide": 0,
            "includeAll": true,
            "label": "Level",
            "multi": false,
            "name": "level",
            "options": [
              {
                "selected": true,
                "text": "All",
                "value": ".*"
              },
              {
                "selected": false,
                "text": "info",
                "value": "info"
              },
              {
                "selected": false,
                "text": "warn",
                "value": "warn"
              },
              {
                "selected": false,
                "text": "error",
                "value": "error"
              },
              {
                "selected": false,
                "text": "debug",
                "value": "debug"
              }
            ],
            "query": ".*,info,warn,error,debug",
            "type": "custom"
          },
          {
            "allValue": ".*",
            "current": {
              "selected": true,
              "text": "All",
              "value": ".*"
            },
            "datasource": "$logs",
            "definition": "label_values({namespace=~\"$namespace\"}, service)",
            "hide": 0,
            "includeAll": true,
            "label": "Service",
            "multi": false,
            "name": "service",
            "options": [],
            "query": "label_values({namespace=~\"$namespace\"}, service)",
            "refresh": 1,
            "sort": 1,
            "type": "query"
          },
          {
            "allValue": ".*",
            "current": {
              "selected": true,
              "text": "All",
              "value": ".*"
            },
            "datasource": "$logs",
            "definition": "label_values({namespace=~\"$namespace\",service=~\"$service\"}, pod)",
            "hide": 0,
            "includeAll": true,
            "label": "Pod",
            "multi": false,
            "name": "pod",
            "options": [],
            "query": "label_values({namespace=~\"$namespace\",service=~\"$service\"}, pod)",
            "refresh": 1,
            "sort": 1,
            "type": "query"
          },
          {
            "allValue": ".*",
            "current": {
              "selected": true,
              "text": "All",
              "value": ".*"
            },
            "datasource": "$logs",
            "definition": "label_values({namespace=~\"$namespace\",service=~\"$service\",pod=~\"$pod\"}, container)",
            "hide": 0,
            "includeAll": true,
            "label": "Container",
            "multi": false,
            "name": "container",
            "options": [],
            "query": "label_values({namespace=~\"$namespace\",service=~\"$service\",pod=~\"$pod\"}, container)",
            "refresh": 1,
            "sort": 1,
            "type": "query"
          }
        ]
      },
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "timezone": "",
      "title": "Pronunt Service Logs",
      "version": 1
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pronunt-grafana-dashboard-workload-health
  namespace: {{ .Release.Namespace }}
  labels:
    grafana_dashboard: "1"
data:
  pronunt-workload-health.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "links": [],
      "panels": [
        {
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "sum(kube_pod_container_status_restarts_total{namespace=~\"$namespace\"})",
              "refId": "A"
            }
          ],
          "title": "Container restarts",
          "type": "stat"
        },
        {
          "datasource": "Prometheus",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 8,
            "y": 0
          },
          "id": 2,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "sum(kube_pod_status_ready{namespace=~\"$namespace\",condition=\"true\"})",
              "refId": "A"
            }
          ],
          "title": "Ready pods",
          "type": "stat"
        },
        {
          "datasource": "Prometheus",
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 16,
            "y": 0
          },
          "id": 3,
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "single"
            }
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=~\"$namespace\",container!=\"\",image!=\"\"}[5m]))",
              "legendFormat": "{{ `{{pod}}` }}",
              "refId": "A"
            }
          ],
          "title": "CPU by pod",
          "type": "timeseries"
        },
        {
          "datasource": "Prometheus",
          "gridPos": {
            "h": 10,
            "w": 12,
            "x": 0,
            "y": 8
          },
          "id": 4,
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "single"
            }
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "sum by (pod) (container_memory_working_set_bytes{namespace=~\"$namespace\",container!=\"\",image!=\"\"})",
              "legendFormat": "{{ `{{pod}}` }}",
              "refId": "A"
            }
          ],
          "title": "Memory by pod",
          "type": "timeseries"
        },
        {
          "datasource": "Prometheus",
          "gridPos": {
            "h": 10,
            "w": 12,
            "x": 12,
            "y": 8
          },
          "id": 5,
          "options": {
            "showHeader": true
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "sum by (pod,container) (rate(container_cpu_usage_seconds_total{namespace=~\"$namespace\",container!=\"\",image!=\"\"}[5m]))",
              "format": "table",
              "instant": true,
              "refId": "A"
            }
          ],
          "title": "Pod CPU table",
          "transformations": [
            {
              "id": "organize",
              "options": {}
            }
          ],
          "type": "table"
        }
      ],
      "refresh": "15s",
      "schemaVersion": 39,
      "style": "dark",
      "tags": [
        "pronunt",
        "kubernetes"
      ],
      "templating": {
        "list": [
          {
            "current": {
              "selected": true,
              "text": "All",
              "value": ".*"
            },
            "datasource": "Prometheus",
            "definition": "label_values(kube_pod_info, namespace)",
            "hide": 0,
            "includeAll": true,
            "label": "Namespace",
            "multi": false,
            "name": "namespace",
            "options": [],
            "query": {
              "query": "label_values(kube_pod_info, namespace)",
              "refId": "Prometheus-namespace"
            },
            "refresh": 2,
            "type": "query"
          }
        ]
      },
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "timezone": "",
      "title": "Pronunt Workload Health",
      "version": 1
    }
{{- end }}
