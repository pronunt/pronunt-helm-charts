promtail:
  config:
    snippets:
      extraRelabelConfigs:
        - action: replace
          replacement: pronunt
          target_label: platform
        - action: replace
          replacement: pronunt-prod
          target_label: environment
        - action: replace
          regex: (.+)
          source_labels:
            - __meta_kubernetes_pod_label_app_kubernetes_io_name
          target_label: service
        - action: replace
          regex: (.+)
          source_labels:
            - __meta_kubernetes_pod_label_app_kubernetes_io_instance
          target_label: service
        - action: replace
          regex: (.+)
          source_labels:
            - app
          target_label: service
