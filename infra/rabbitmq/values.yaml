fullnameOverride: pronunt-rabbitmq

namespace:
  name: pronunt-app-ns

image:
  repository: rabbitmq
  tag: "3.13-management"
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: ""
  automountServiceAccountToken: false

secretTemplate:
  enabled: false

service:
  amqpPort: 5672
  managementPort: 15672

persistence:
  enabled: true
  size: 10Gi
  accessModes:
    - ReadWriteMany
  storageClassName: pronunt-nfs-csi

credentials:
  username: <set-rabbitmq-username-via-sealed-secret>
  password: <set-rabbitmq-password-via-sealed-secret>
  vhost: <set-rabbitmq-vhost>

podSecurityContext:
  fsGroup: 999
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  runAsNonRoot: true
  runAsUser: 999
  runAsGroup: 999
  readOnlyRootFilesystem: false

nodeSelector: {}
tolerations: []
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          topologyKey: kubernetes.io/hostname
          labelSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - pronunt-rabbitmq

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

livenessProbe:
  tcpSocket:
    port: 5672
  initialDelaySeconds: 30
  periodSeconds: 20

readinessProbe:
  tcpSocket:
    port: 5672
  initialDelaySeconds: 15
  periodSeconds: 10
