loki:
  loki:
    auth_enabled: false
    commonConfig:
      replication_factor: 1
    schemaConfig:
      configs:
        - from: "2024-04-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: loki_index_
            period: 24h
    storage_config:
      filesystem:
        directory: /var/loki/chunks
    compactor:
      working_directory: /var/loki/compactor
    limits_config:
      retention_period: 168h
      allow_structured_metadata: false

  deploymentMode: SingleBinary

  global:
    storageClass: pronunt-nfs-csi

  singleBinary:
    replicas: 1
    persistence:
      enabled: true
      storageClass: pronunt-nfs-csi
      accessModes:
        - ReadWriteMany
      size: 20Gi

  backend:
    replicas: 0

  read:
    replicas: 0

  write:
    replicas: 0

  ingester:
    replicas: 0

  querier:
    replicas: 0

  queryFrontend:
    replicas: 0

  queryScheduler:
    replicas: 0

  distributor:
    replicas: 0

  compactor:
    replicas: 0

  indexGateway:
    replicas: 0

  gateway:
    enabled: false

  lokiCanary:
    enabled: false

  monitoring:
    enabled: false

  test:
    enabled: false
