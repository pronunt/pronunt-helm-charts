apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.fullnameOverride }}
  namespace: {{ .Values.namespace.name }}
spec:
  selector:
    app: {{ .Values.fullnameOverride }}
  ports:
    - name: mongodb
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.fullnameOverride }}-headless
  namespace: {{ .Values.namespace.name }}
spec:
  clusterIP: None
  selector:
    app: {{ .Values.fullnameOverride }}
  ports:
    - name: mongodb
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
